<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(orientation: portrait) and (max-width: 599.98px) and (hover: none) and (pointer: coarse)" content="#0b0c0f" />
    <meta name="theme-color" content="#e8e6e1" />
    <title>UNSEEN — the 2026 grand-prix car, opened up</title>
    <meta name="description" content="Drag the speed and watch downforce appear. An interactive 3D explainer of the 2026 grand-prix car: the forces you can't see, drawn to scale with live numbers." />
    <meta property="og:title" content="UNSEEN — the 2026 grand-prix car, opened up" />
    <meta property="og:description" content="Drag the speed and watch downforce appear. Station 01: why a grand-prix car could drive on the ceiling." />
    <meta property="og:type" content="website" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A 2026 grand-prix car on a wind-tunnel rolling road with downforce arrows and a speed slider." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <main id="stage" aria-label="3D view: a 2026 grand-prix car on a wind-tunnel rolling road"></main>
      <div id="boot" aria-hidden="true">Warming up the tunnel…</div>
      <div id="ui"></div>
      <noscript>This explainer needs JavaScript and WebGL.</noscript>
    </div>
    <!-- Phones held upright: the explainer needs a wide screen. Shown by src/styles/rotate.css (no
         script needed, so it is there from the first paint); src/main.ts makes the app behind it inert
         and pauses it. -->
    <div id="rotate" class="rotate" role="dialog" aria-modal="true" aria-labelledby="rotate-title" aria-describedby="rotate-text">
      <p class="rotate-mark">UNSEEN</p>
      <svg class="rotate-art" viewBox="0 0 200 200" width="200" height="200" aria-hidden="true" focusable="false">
        <path class="rotate-arrow" d="M 44 62 A 64 64 0 0 1 156 62" />
        <path class="rotate-arrow-head" d="M 157 49 L 156 62 L 144 57" />
        <g class="rotate-phone">
          <rect x="70" y="44" width="60" height="112" rx="12" class="rotate-body" />
          <rect x="91" y="51" width="18" height="4" rx="2" class="rotate-speaker" />
          <g class="rotate-car" transform="translate(100 102) rotate(-90)">
            <path d="M -31 5 L -27 -1 L -11 -3 L -5 -10 L 7 -10 L 13 -4 L 28 -3 L 31 5 Z" />
            <circle cx="-19" cy="6" r="5" />
            <circle cx="19" cy="6" r="5" />
          </g>
        </g>
      </svg>
      <h2 id="rotate-title" class="rotate-title">Turn your phone sideways</h2>
      <p id="rotate-text" class="rotate-text">The car needs the full width of the screen.</p>
      <p class="rotate-hint">Screen won’t turn? Switch off rotation lock — on iPhone, in Control Center.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
